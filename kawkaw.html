<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0614">
<title>A Little Surprise ✨</title>
<style>
  :root{
    --pink:#ff8fc7; --pink2:#ffc2e0; --purple:#8b5cf6; --deep:#2a1250; --black:#07030f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--black);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;color:#fff}
  body{
    background:
      radial-gradient(ellipse at 20% 15%, rgba(139,92,246,.45), transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(255,143,199,.30), transparent 55%),
      radial-gradient(ellipse at 50% 50%, #170a2e 0%, #07030f 80%);
    background-attachment:fixed;
  }
  canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  #hearts{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .heart{position:absolute;bottom:-40px;opacity:0;filter:drop-shadow(0 0 8px rgba(255,143,199,.8));
    animation:floatUp linear forwards;will-change:transform,opacity}
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}
    10%{opacity:.9}
    50%{transform:translateY(-55vh) translateX(var(--sway)) rotate(12deg)}
    100%{transform:translateY(-115vh) translateX(calc(var(--sway)*-1)) rotate(-12deg);opacity:0}
  }

  /* screens */
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;padding:24px;text-align:center}
  #welcome{transition:opacity .9s ease, transform .9s ease, filter .9s ease}
  #welcome.gone{opacity:0;transform:scale(1.15);filter:blur(10px);pointer-events:none}
  .orb{
    width:110px;height:110px;border-radius:50%;margin-bottom:34px;position:relative;
    background:radial-gradient(circle at 35% 30%, #fff 0%, var(--pink2) 18%, var(--pink) 40%, var(--purple) 75%, transparent 76%);
    box-shadow:0 0 50px 10px rgba(255,143,199,.45),0 0 120px 30px rgba(139,92,246,.4);
    animation:orb 4s ease-in-out infinite;
  }
  .orb::before,.orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid rgba(255,194,224,.45);animation:ring 3s ease-out infinite}
  .orb::after{animation-delay:1.5s}
  @keyframes orb{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.06)}}
  @keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  h1{font-size:clamp(1.7rem,7vw,2.6rem);font-weight:700;letter-spacing:.02em;
    background:linear-gradient(90deg,#fff,var(--pink2),#c4b5fd,#fff);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
  @keyframes shine{to{background-position:200% center}}
  .sub{margin:12px 0 38px;color:#cdbfe8;font-size:clamp(.95rem,3.8vw,1.1rem);opacity:.85}
  .btn{
    position:relative;border:0;cursor:pointer;color:#fff;font-size:clamp(1rem,4.4vw,1.2rem);font-weight:600;
    padding:16px 34px;border-radius:999px;letter-spacing:.03em;
    background:linear-gradient(120deg,#8b5cf6,#ec4899 60%,#ff8fc7);background-size:200% 200%;
    box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 10px 40px rgba(236,72,153,.45),0 0 60px rgba(139,92,246,.45);
    animation:btnGrad 4s ease infinite, pulse 2.2s ease-in-out infinite;
    transition:transform .2s ease;
  }
  .btn:active{transform:scale(.95)}
  .btn:hover{transform:translateY(-2px) scale(1.03)}
  @keyframes btnGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 10px 40px rgba(236,72,153,.45),0 0 60px rgba(139,92,246,.45)}
    50%{box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 10px 55px rgba(236,72,153,.75),0 0 90px rgba(139,92,246,.7)}}

  /* stage */
  #stage{opacity:0;pointer-events:none;justify-content:flex-end;padding-bottom:max(18px,env(safe-area-inset-bottom))}
  #stage.on{opacity:1;pointer-events:auto}
  .charWrap{position:relative;width:min(74vw,320px);aspect-ratio:3/4;margin-top:auto}
  .portal{position:absolute;left:50%;top:46%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%) scale(0);border-radius:50%;
    background:conic-gradient(from 0deg,transparent,rgba(139,92,246,.55),rgba(255,143,199,.55),transparent 60%,rgba(139,92,246,.4),transparent);
    filter:blur(22px);opacity:0}
  .on .portal{animation:portal 2.2s cubic-bezier(.2,.8,.2,1) forwards, spin 9s linear 2.2s infinite}
  @keyframes portal{0%{transform:translate(-50%,-50%) scale(0) rotate(0);opacity:0}40%{opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(200deg);opacity:.55}}
  @keyframes spin{to{transform:translate(-50%,-50%) scale(1) rotate(560deg)}}
  .flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 55%,#fff,rgba(255,194,224,.7) 30%,transparent 65%);opacity:0;pointer-events:none;z-index:9}
  .flash.go{animation:flash 1s ease-out}
  @keyframes flash{0%{opacity:0}15%{opacity:.95}100%{opacity:0}}
  svg#char{position:relative;width:100%;height:100%;overflow:visible;opacity:0;transform:translateY(70px) scale(.5);filter:blur(14px) brightness(2)}
  .on svg#char{animation:enter 1.4s cubic-bezier(.2,1.1,.3,1) .35s forwards, bob 4s ease-in-out 1.9s infinite}
  @keyframes enter{0%{opacity:0;transform:translateY(70px) scale(.5);filter:blur(14px) brightness(2.4)}
    60%{opacity:1;filter:blur(0) brightness(1.4)}100%{opacity:1;transform:none;filter:blur(0) brightness(1) drop-shadow(0 0 25px rgba(255,143,199,.45))}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .wave{transform-origin:222px 292px;animation:wave 1.1s ease-in-out 1.8s 4}
  @keyframes wave{0%,100%{transform:rotate(0)}30%{transform:rotate(-22deg)}65%{transform:rotate(10deg)}}
  .twinkle{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes tw{0%,100%{opacity:.4;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
  .hair{animation:sway 5s ease-in-out infinite;transform-origin:150px 90px}
  @keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}

  /* speech bubble */
  .bubble{
    position:absolute;left:50%;top:-6%;transform:translate(-50%,10px) scale(.6);opacity:0;
    min-width:190px;max-width:86vw;padding:14px 22px;border-radius:26px;text-align:center;
    background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(255,226,242,.94));color:#3b1466;
    font-weight:700;font-size:clamp(1.05rem,4.8vw,1.35rem);line-height:1.5;
    box-shadow:0 12px 40px rgba(139,92,246,.5),0 0 40px rgba(255,143,199,.5);
    transition:opacity .5s ease,transform .6s cubic-bezier(.2,1.4,.4,1);z-index:6;
  }
  .bubble::after{content:"";position:absolute;bottom:-14px;left:50%;margin-left:-14px;width:28px;height:28px;
    background:rgba(255,226,242,.94);transform:rotate(45deg) skew(10deg,10deg);border-radius:0 0 8px 0}
  .bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
  .bubble.fade{opacity:0;transform:translate(-50%,-14px) scale(.92)}
  .bubble div{opacity:0;transform:translateY(8px);transition:all .5s ease}
  .bubble div.in{opacity:1;transform:none}
  .bubble .l2{color:#d6246e}

  /* big heart */
  #bigHeart{position:fixed;left:50%;top:42%;width:min(58vw,260px);z-index:8;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}
  #bigHeart.show{animation:heartIn 3.4s ease forwards}
  @keyframes heartIn{
    0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0}
    18%{transform:translate(-50%,-50%) scale(1.15) rotate(4deg);opacity:1}
    28%{transform:translate(-50%,-50%) scale(.95)}
    38%{transform:translate(-50%,-50%) scale(1.1)}
    48%{transform:translate(-50%,-50%) scale(.98)}
    58%{transform:translate(-50%,-50%) scale(1.08)}
    82%{transform:translate(-50%,-50%) scale(1);opacity:1}
    100%{transform:translate(-50%,-70%) scale(.3);opacity:0}}
  .burst{position:fixed;left:50%;top:42%;z-index:7;pointer-events:none;font-size:22px;will-change:transform,opacity;filter:drop-shadow(0 0 6px rgba(255,143,199,.9))}

  /* final */
  .final{
    position:absolute;left:50%;bottom:calc(100% - 12px);transform:translate(-50%,20px);opacity:0;width:min(88vw,380px);
    padding:18px 22px;text-align:center;border-radius:24px;
    background:linear-gradient(160deg,rgba(42,18,80,.82),rgba(80,20,70,.78));
    border:1px solid rgba(255,194,224,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 0 50px rgba(236,72,153,.4),0 0 90px rgba(139,92,246,.35);
    font-size:clamp(1.15rem,5.2vw,1.5rem);font-weight:700;line-height:1.45;
    transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,1,.3,1);z-index:7;
  }
  .final.show{opacity:1;transform:translate(-50%,0)}
  .final span{background:linear-gradient(90deg,#fff,var(--pink2),#d8b4fe);-webkit-background-clip:text;background-clip:text;color:transparent}
  .actions{display:flex;gap:10px;justify-content:center;margin-top:14px;opacity:0;transition:opacity 1s ease}
  .actions.show{opacity:1}
  .mini{border:1px solid rgba(255,194,224,.45);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:9px 18px;font-size:.9rem;cursor:pointer;transition:background .2s}
  .mini:hover{background:rgba(255,255,255,.18)}
  .from{margin:-22px 0 34px;font-size:clamp(1rem,4.2vw,1.15rem);color:#e7d8ff;letter-spacing:.04em}
  .from b,.sig b{font-weight:700;background:linear-gradient(90deg,#ffc2e0,#d8b4fe,#ffc2e0);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite;
    text-shadow:0 0 18px rgba(255,143,199,.6)}
  .sig{margin-top:10px;font-size:clamp(.95rem,4vw,1.1rem);font-weight:600;color:#e7d8ff;font-style:italic}
  .dock{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="hearts"></div>
<div class="flash" id="flash"></div>

<!-- Welcome -->
<section class="screen" id="welcome">
  <div class="orb"></div>
  <h1>Something is waiting for you…</h1>
  <p class="sub">Made with love, just for you 💜</p>
  <p class="from">from <b>Kawtar</b> ✨</p>
  <button class="btn" id="openBtn">Open your surprise ✨</button>
</section>

<!-- Stage -->
<section class="screen" id="stage">
  <div class="charWrap" id="charWrap">
    <div class="portal"></div>
    <div class="bubble" id="bubble"><div class="l1">Hey! 👋</div><div class="l2">She loves you ❤️</div></div>

    <svg id="char" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg" aria-label="A cute original anime moon-sprite waving">
      <defs>
        <linearGradient id="gHair" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d9c8ff"/><stop offset=".6" stop-color="#c4a9ff"/><stop offset="1" stop-color="#ff9ccf"/>
        </linearGradient>
        <linearGradient id="gHood" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6d3fd1"/><stop offset="1" stop-color="#2a1250"/>
        </linearGradient>
        <radialGradient id="gEye" cx=".5" cy=".35" r=".8">
          <stop offset="0" stop-color="#ffb3e0"/><stop offset=".55" stop-color="#9b5cf6"/><stop offset="1" stop-color="#2a1250"/>
        </radialGradient>
        <radialGradient id="gAura" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#ff8fc7" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#ffb3d9"/></linearGradient>
      </defs>

      <circle cx="150" cy="170" r="150" fill="url(#gAura)"/>

      <!-- floating sparkles -->
      <g fill="url(#gGold)">
        <path class="twinkle" d="M40 120 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
        <path class="twinkle" style="animation-delay:.7s" d="M262 90 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
        <path class="twinkle" style="animation-delay:1.3s" d="M55 250 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
      </g>

      <!-- body / hoodie -->
      <path d="M62 400 Q60 268 150 248 Q240 268 238 400 Z" fill="url(#gHood)"/>
      <path d="M62 400 Q60 268 150 248 Q240 268 238 400" fill="none" stroke="#ff9ccf" stroke-width="3" opacity=".7"/>
      <!-- hood rim -->
      <ellipse cx="150" cy="252" rx="56" ry="22" fill="#4a24a0"/>
      <ellipse cx="150" cy="248" rx="46" ry="15" fill="#ffe3d6"/>
      <!-- drawstrings -->
      <path d="M135 262 Q132 300 138 318" stroke="#ffc2e0" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M165 262 Q168 300 162 318" stroke="#ffc2e0" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="138" cy="320" r="4.5" fill="#fff3b0"/><circle cx="162" cy="320" r="4.5" fill="#fff3b0"/>
      <!-- chest crescent + stars -->
      <path d="M150 335 A22 22 0 1 0 170 360 A17 17 0 1 1 150 335 Z" fill="url(#gGold)" opacity=".95"/>
      <g fill="#ffc2e0" opacity=".85">
        <circle cx="95" cy="340" r="3"/><circle cx="205" cy="330" r="3"/><circle cx="110" cy="375" r="2.5"/><circle cx="195" cy="372" r="2.5"/><circle cx="80" cy="310" r="2"/><circle cx="222" cy="352" r="2"/>
      </g>
      <!-- left arm -->
      <path d="M78 290 Q52 330 70 372" stroke="#5a2fb8" stroke-width="28" stroke-linecap="round" fill="none"/>
      <!-- waving arm -->
      <g class="wave">
        <path d="M222 292 Q262 272 258 218" stroke="#5a2fb8" stroke-width="28" stroke-linecap="round" fill="none"/>
        <circle cx="258" cy="206" r="15" fill="#ffe3d6"/>
        <g stroke="#f2c3b3" stroke-width="2" stroke-linecap="round"><path d="M250 196 l-2 -6"/><path d="M258 192 l0 -7"/><path d="M266 196 l3 -6"/></g>
      </g>

      <!-- hair back -->
      <g class="hair">
        <path d="M76 150 Q70 70 150 60 Q230 70 224 150 Q226 205 204 222 L96 222 Q74 205 76 150Z" fill="url(#gHair)"/>
        <!-- ahoge tuft -->
        <path d="M148 64 Q140 30 168 22 Q158 42 160 64Z" fill="#d9c8ff"/>
      </g>

      <!-- face -->
      <ellipse cx="150" cy="162" rx="58" ry="54" fill="#ffe3d6"/>
      <ellipse cx="150" cy="215" rx="10" ry="6" fill="#f6cfc0" opacity=".0"/>

      <!-- bangs -->
      <g class="hair">
        <path d="M88 150 Q90 86 150 82 Q210 86 212 150 Q198 118 180 126 Q168 100 150 124 Q132 100 120 126 Q102 118 88 150Z" fill="url(#gHair)"/>
        <path d="M84 150 Q76 190 94 214 Q100 180 102 150Z" fill="url(#gHair)"/>
        <path d="M216 150 Q224 190 206 214 Q200 180 198 150Z" fill="url(#gHair)"/>
        <path d="M120 126 Q124 108 136 104" stroke="#fff" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>

      <!-- eyes -->
      <g class="blink">
        <ellipse cx="124" cy="166" rx="12.5" ry="16" fill="url(#gEye)"/>
        <ellipse cx="176" cy="166" rx="12.5" ry="16" fill="url(#gEye)"/>
        <ellipse cx="124" cy="168" rx="5" ry="8" fill="#1a0b33"/>
        <ellipse cx="176" cy="168" rx="5" ry="8" fill="#1a0b33"/>
        <circle cx="119" cy="160" r="4.5" fill="#fff"/><circle cx="171" cy="160" r="4.5" fill="#fff"/>
        <circle cx="129" cy="174" r="2.2" fill="#fff" opacity=".9"/><circle cx="181" cy="174" r="2.2" fill="#fff" opacity=".9"/>
      </g>
      <path d="M109 152 Q124 144 138 152" stroke="#3b1466" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M162 152 Q176 144 191 152" stroke="#3b1466" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- blush -->
      <ellipse cx="106" cy="190" rx="11" ry="6.5" fill="#ff8fc7" opacity=".55"/>
      <ellipse cx="194" cy="190" rx="11" ry="6.5" fill="#ff8fc7" opacity=".55"/>
      <!-- mouth -->
      <path d="M139 196 Q150 208 161 196" stroke="#c2407e" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M145 199 Q150 205 155 199 Q150 202 145 199Z" fill="#ff7aa8"/>

      <!-- moon hair clip -->
      <path d="M196 98 A15 15 0 1 0 205 124 A12 12 0 1 1 196 98 Z" fill="url(#gGold)" stroke="#ffb3d9" stroke-width="1"/>
      <path class="twinkle" style="animation-delay:.4s" d="M214 100 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" fill="#fff3b0"/>
    </svg>

    <div class="dock">
      <div class="final" id="final"><span>You are someone special.<br>Never forget that! 💗</span>
        <div class="sig">— with love, <b>Kawtar</b> 💜</div>
        <div class="actions" id="actions">
          <button class="mini" id="replay">↻ Replay</button>
          <button class="mini" id="share">Share 💌</button>
        </div>
      </div>
    </div>
  </div>
</section>

<svg id="bigHeart" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2e0"/><stop offset=".5" stop-color="#ff5fa8"/><stop offset="1" stop-color="#9b5cf6"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path filter="url(#glow)" fill="url(#gH)" d="M50 82 C12 55 4 36 12 21 C20 8 40 8 50 26 C60 8 80 8 88 21 C96 36 88 55 50 82Z"/>
  <path fill="#fff" opacity=".45" d="M24 22 C28 16 36 15 40 20 C34 19 28 21 24 28Z"/>
</svg>

<script>
(() => {
  /* ---------- Starry sky + particles ---------- */
  const cv = document.getElementById('sky'), ctx = cv.getContext('2d');
  let W, H, stars = [], motes = [], dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize(){
    W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(W*H/7000);
    stars = Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,p:Math.random()*6.28,s:Math.random()*1.5+.5,hue:Math.random()<.35?330:Math.random()<.5?270:0}));
    motes = Array.from({length:Math.round(n/3)},()=>mote(true));
  }
  function mote(init){
    return {x:Math.random()*W,y:init?Math.random()*H:H+10,r:Math.random()*2.2+.6,vy:-(Math.random()*.35+.1),vx:(Math.random()-.5)*.2,a:Math.random()*.5+.2,hue:Math.random()<.5?320:268};
  }
  function drawStar(s,t){
    const tw = .5 + .5*Math.sin(t*.001*s.s + s.p);
    ctx.globalAlpha = .25 + tw*.75;
    ctx.fillStyle = s.hue ? `hsl(${s.hue},90%,82%)` : '#fff';
    ctx.shadowColor = s.hue ? `hsl(${s.hue},90%,70%)` : '#fff'; ctx.shadowBlur = 6*tw;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r*(.7+tw*.5),0,6.283); ctx.fill();
    if (s.r > 1.2){ // sparkle cross
      ctx.globalAlpha *= .5; ctx.fillRect(s.x-s.r*3*tw,s.y-.4,s.r*6*tw,.8); ctx.fillRect(s.x-.4,s.y-s.r*3*tw,.8,s.r*6*tw);
    }
  }
  function loop(t){
    ctx.clearRect(0,0,W,H);
    for (const s of stars) drawStar(s,t);
    ctx.shadowBlur = 0;
    for (let i=0;i<motes.length;i++){
      const m = motes[i]; m.y += m.vy; m.x += m.vx + Math.sin(t*.0008+i)*.15;
      if (m.y < -10) motes[i] = mote(false);
      ctx.globalAlpha = m.a; ctx.fillStyle = `hsl(${m.hue},95%,78%)`;
      ctx.shadowColor = `hsl(${m.hue},95%,70%)`; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,6.283); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    requestAnimationFrame(loop);
  }
  addEventListener('resize',resize); resize(); requestAnimationFrame(loop);

  /* ---------- Floating hearts ---------- */
  const heartsBox = document.getElementById('hearts');
  const glyphs = ['💗','💜','💖','🩷','✨','💕'];
  function spawnHeart(){
    const h = document.createElement('span'); h.className = 'heart';
    h.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (12 + Math.random()*22) + 'px';
    h.style.setProperty('--sway',(Math.random()*60-30)+'px');
    h.style.animationDuration = (7 + Math.random()*7) + 's';
    heartsBox.appendChild(h);
    h.addEventListener('animationend',()=>h.remove());
  }
  setInterval(spawnHeart, 900);
  for (let i=0;i<5;i++) setTimeout(spawnHeart, i*300);

  /* ---------- Sequence ---------- */
  const $ = id => document.getElementById(id);
  const welcome=$('welcome'), stage=$('stage'), bubble=$('bubble'), flash=$('flash'),
        big=$('bigHeart'), fin=$('final'), actions=$('actions');
  const l1 = bubble.querySelector('.l1'), l2 = bubble.querySelector('.l2');
  let timers = [];
  const later = (fn,ms)=>timers.push(setTimeout(fn,ms));

  function burst(){
    const colors = ['💗','💜','💖','✨','💕','🩷','⭐'];
    const rect = big.getBoundingClientRect();
    for (let i=0;i<46;i++){
      const b = document.createElement('span'); b.className='burst';
      b.textContent = colors[i%colors.length];
      b.style.fontSize = (14+Math.random()*22)+'px';
      document.body.appendChild(b);
      const ang = Math.random()*Math.PI*2, dist = 90 + Math.random()*Math.min(innerWidth,420)*.55;
      const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 40;
      b.animate([
        {transform:'translate(-50%,-50%) scale(.2) rotate(0)',opacity:0},
        {transform:`translate(calc(-50% + ${dx*.6}px),calc(-50% + ${dy*.6}px)) scale(1.2) rotate(${Math.random()*80-40}deg)`,opacity:1,offset:.35},
        {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy+120}px)) scale(.6) rotate(${Math.random()*200-100}deg)`,opacity:0}
      ],{duration:1800+Math.random()*1400,easing:'cubic-bezier(.2,.7,.3,1)',delay:Math.random()*250}).onfinish = ()=>b.remove();
    }
  }

  function play(){
    welcome.classList.add('gone');
    stage.classList.add('on');
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    for (let i=0;i<10;i++) setTimeout(spawnHeart, i*120);

    later(()=>{ bubble.classList.add('show'); l1.classList.add('in'); }, 2100);
    later(()=>{ l2.classList.add('in'); }, 3500);
    later(()=>{ bubble.classList.add('fade'); big.classList.add('show'); burst();
                for (let i=0;i<14;i++) setTimeout(spawnHeart, i*90); }, 5600);
    later(()=>{ burst(); }, 6600);
    later(()=>{ fin.classList.add('show'); }, 8400);
    later(()=>{ actions.classList.add('show'); }, 9800);
  }

  function reset(){
    timers.forEach(clearTimeout); timers = [];
    [bubble,fin,actions,big].forEach(e=>e.classList.remove('show','fade'));
    [l1,l2].forEach(e=>e.classList.remove('in'));
    stage.classList.remove('on');
    const c = $('char'); c.style.animation='none'; void c.getBoundingClientRect(); c.style.animation='';
    const p = document.querySelector('.portal'); p.style.animation='none'; void p.offsetWidth; p.style.animation='';
    setTimeout(play, 350);
  }

  $('openBtn').addEventListener('click', play);
  $('replay').addEventListener('click', reset);
  $('share').addEventListener('click', async () => {
    const data = {title:'A little surprise ✨', text:'Someone made a little surprise for you 💜', url:location.href.startsWith('http')?location.href:undefined};
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(data.text); $('share').textContent='Copied ✓'; } }
    catch(e){}
  });
})();
</script>
</body>
</html>
